<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Прокси бейджи</title>
    <style>
        * { box-sizing: border-box; font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; }
        body {
            background: #0f172a;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            min-height: 100vh;
            margin: 0;
            padding: 20px 15px;
        }
        .container {
            max-width: 900px;
            width: 100%;
            background: #1e293b;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            padding: 24px 20px;
        }
        h1 {
            font-size: 1.4rem;
            font-weight: 600;
            color: #f1f5f9;
            margin: 0 0 8px 0;
        }
        .subhead {
            color: #94a3b8;
            margin-bottom: 20px;
            font-size: 0.85rem;
            line-height: 1.4;
        }
        .input-group {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-bottom: 12px;
            background: #0f172a;
            padding: 16px;
            border-radius: 14px;
            border: 1px solid #334155;
        }
        .input-group input, .input-group textarea {
            flex: 1 1 200px;
            padding: 12px 16px;
            border: 1.5px solid #334155;
            border-radius: 10px;
            font-size: 0.9rem;
            background: #1e293b;
            color: #f1f5f9;
            outline: none;
            transition: 0.2s;
            font-family: inherit;
        }
        .input-group textarea {
            resize: vertical;
            min-height: 80px;
            width: 100%;
        }
        .input-group input:focus, .input-group textarea:focus {
            border-color: #3b82f6;
        }
        .input-group input::placeholder, .input-group textarea::placeholder { color: #64748b; }
        .input-group button {
            padding: 12px 24px;
            background: #3b82f6;
            border: none;
            border-radius: 10px;
            color: white;
            font-weight: 600;
            font-size: 0.9rem;
            cursor: pointer;
            transition: 0.2s;
        }
        .input-group button:hover { background: #2563eb; }
        .input-group button.btn-mass {
            background: #10b981;
        }
        .input-group button.btn-mass:hover { background: #059669; }

        .output-box {
            background: #0f172a;
            border: 1px solid #334155;
            border-radius: 14px;
            padding: 20px;
            min-height: 100px;
            overflow-x: hidden; /* Защита от вылезания */
        }
        .output-label {
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: #64748b;
            font-weight: 700;
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .output-label .count {
            background: #3b82f6;
            color: white;
            padding: 2px 10px;
            border-radius: 20px;
            font-size: 0.7rem;
        }

        /* Контейнер для текста */
        .badges-line {
            display: block;
            line-height: 1.6;
            font-family: 'SF Mono', 'Fira Code', 'Consolas', monospace;
            font-size: 0.85rem;
            color: #cbd5e1;
        }

        /* Блок одного бейджа, чтобы он не слипался с соседним */
        .badge-item {
            display: inline;
            margin-bottom: 8px; /* Отступ снизу для мобилок */
        }

        /* Ссылка внутри строки */
        .badge-link {
            color: #60a5fa;
            text-decoration: none;
            word-break: break-all; /* Ссылка переносится по буквам, если длинная */
        }
        .badge-link:hover { text-decoration: underline; }

        /* Текст стиля */
        .style-text.red { color: #f87171; font-weight: 600; }
        .style-text.green { color: #4ade80; font-weight: 600; }
        .style-text.blue { color: #60a5fa; font-weight: 600; }

        /* Разделитель */
        .separator {
            color: #64748b;
            margin: 0 8px;
            font-weight: 300;
            white-space: nowrap; /* Чтобы "|" не отрывался от текста */
        }

        /* Кнопка удаления (крестик) */
        .remove-btn {
            background: none;
            border: none;
            color: #475569;
            cursor: pointer;
            font-size: 0.9rem;
            padding: 0 4px;
            margin-left: 6px;
            line-height: 1;
            transition: 0.15s;
            vertical-align: middle;
        }
        .remove-btn:hover { color: #ef4444; }

        .empty {
            color: #64748b;
            font-style: italic;
            font-size: 0.9rem;
            font-family: system-ui, sans-serif;
        }
        .actions {
            margin-top: 16px;
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }
        .actions button {
            padding: 10px 16px;
            background: #334155;
            border: none;
            border-radius: 10px;
            color: #cbd5e1;
            font-size: 0.8rem;
            cursor: pointer;
            transition: 0.2s;
        }
        .actions button:hover { background: #475569; color: #f1f5f9; }
        .actions button.danger:hover { background: #7f1d1d; color: #fca5a5; }
    </style>
</head>
<body>
<div class="container">
    <h1>🔗 Прокси бейджи</h1>
    <div class="subhead">
        Строго по <b>три</b> бейджа в ряд через <code>|</code>.<br>
        Формат: <code>Название - Ссылка - style:цвет</code>
    </div>

    <!-- Поле для названия -->
    <div class="input-group">
        <input type="text" id="nameInput" placeholder="Название (напр. Прокси)" value="Котикам" style="flex: 1 1 100%;">
    </div>

    <!-- Массовое добавление -->
    <div class="input-group" style="flex-direction: column; align-items: stretch;">
        <textarea id="massInput" placeholder="Вставьте ссылки (каждую с новой строки или сплошным текстом)..."></textarea>
        <button id="massBtn" class="btn-mass" style="align-self: flex-start; margin-top: 8px;">📋 Добавить списком</button>
    </div>

    <div class="output-box">
        <div class="output-label">
            📋 Бейджи <span class="count" id="badgeCount">0</span>
        </div>
        <!-- Сюда рендерятся бейджи -->
        <div class="badges-line" id="badgesContainer">
            <span class="empty">Пока пусто. Добавьте бейдж выше.</span>
        </div>
        <div class="actions">
            <button id="copyBtn">📋 Скопировать всё</button>
            <button id="clearBtn" class="danger">🗑 Очистить</button>
        </div>
    </div>
</div>

<script>
    let badges = [];
    const colors = ['red', 'green', 'blue'];
    let currentColorIndex = 0;
    const PER_ROW = 3; // По сколько бейджей в ряду

    const nameInput = document.getElementById('nameInput');
    const massInput = document.getElementById('massInput');
    const massBtn = document.getElementById('massBtn');
    const container = document.getElementById('badgesContainer');
    const badgeCount = document.getElementById('badgeCount');
    const copyBtn = document.getElementById('copyBtn');
    const clearBtn = document.getElementById('clearBtn');

    // Функция форматирования одного бейджа в строку
    function formatBadge(b) {
        return `${b.name} - ${b.link} - style:${b.style}`;
    }

    // Отрисовка на экране
    function render() {
        container.innerHTML = '';

        if (badges.length === 0) {
            container.innerHTML = '<span class="empty">Пока пусто. Добавьте бейдж выше.</span>';
            badgeCount.textContent = '0';
            return;
        }

        badgeCount.textContent = badges.length;

        for (let i = 0; i < badges.length; i += PER_ROW) {
            const groupEnd = Math.min(i + PER_ROW, badges.length);
            
            // Выводим бейджи в текущей строке
            for (let j = i; j < groupEnd; j++) {
                appendBadgeDOM(container, badges[j], j);

                // Разделитель "|" ставим после каждого бейджа, КРОМЕ последнего в строке
                if (j < groupEnd - 1) {
                    const sep = document.createElement('span');
                    sep.className = 'separator';
                    sep.textContent = '|';
                    container.appendChild(sep);
                }
            }

            // Перенос строки после каждого ряда
            container.appendChild(document.createElement('br'));
            container.appendChild(document.createElement('br')); // Двойной перенос для мобилок
        }
    }

    // Добавление элементов в DOM
    function appendBadgeDOM(parent, badge, idx) {
        // Оборачиваем каждый бейдж в span, чтобы управлять отступами
        const wrapper = document.createElement('span');
        wrapper.className = 'badge-item';

        const nameSpan = document.createElement('span');
        nameSpan.style.fontWeight = 'bold';
        nameSpan.style.color = '#e2e8f0';
        nameSpan.textContent = badge.name;
        wrapper.appendChild(nameSpan);

        wrapper.appendChild(document.createTextNode(' - '));

        const link = document.createElement('a');
        link.className = 'badge-link';
        link.href = badge.link;
        link.target = '_blank';
        link.rel = 'noopener noreferrer';
        link.textContent = badge.link;
        wrapper.appendChild(link);

        wrapper.appendChild(document.createTextNode(' - '));

        const styleSpan = document.createElement('span');
        styleSpan.className = 'style-text ' + badge.style;
        styleSpan.textContent = 'style:' + badge.style;
        wrapper.appendChild(styleSpan);

        const rm = document.createElement('button');
        rm.className = 'remove-btn';
        rm.innerHTML = '&times;';
        rm.title = 'Удалить';
        rm.addEventListener('click', () => {
            badges.splice(idx, 1);
            render();
        });
        wrapper.appendChild(rm);

        parent.appendChild(wrapper);
    }

    // Массовое добавление
    function addMass() {
        let text = massInput.value.trim();
        if (!text) return;

        // МАГИЯ ОЧИСТКИ: Убираем скрытые переносы строк (URL-encoded), которые слипают ссылки
        text = text.replace(/%0A/g, '\n').replace(/%0D/g, '\n');
        
        // Разбиваем на строки, убираем пустые места, ищем только ссылки
        const links = text.split('\n').map(l => l.trim()).filter(l => l.startsWith('http'));

        // Если вставили сплошняком без переносов, но со скрытыми символами
        let finalLinks = [];
        links.forEach(l => {
             // Если внутри строки всё ещё есть "https://", разбиваем её
             if (l.indexOf('https://') !== l.lastIndexOf('https://')) {
                 const parts = l.split('https://');
                 parts.forEach((p, index) => {
                     if (index > 0) finalLinks.push('https://' + p);
                 });
             } else {
                 finalLinks.push(l);
             }
        });

        finalLinks.forEach(link => {
            const name = nameInput.value.trim() || 'Котикам';
            const style = colors[currentColorIndex];
            badges.push({ name, link, style });
            currentColorIndex = (currentColorIndex + 1) % colors.length; // Цикл: red -> green -> blue
        });

        render();
        massInput.value = ''; 
    }

    massBtn.addEventListener('click', addMass);

    // КОПИРОВАНИЕ (Формирует текст строго как на экране)
    copyBtn.addEventListener('click', () => {
        if (badges.length === 0) return;
        
        let lines = [];
        
        for (let i = 0; i < badges.length; i += PER_ROW) {
            const groupEnd = Math.min(i + PER_ROW, badges.length);
            let rowItems = [];
            
            for (let j = i; j < groupEnd; j++) {
                rowItems.push(formatBadge(badges[j]));
            }
            
            lines.push(rowItems.join(' | '));
        }
        
        const finalText = lines.join('\n');
        
        navigator.clipboard.writeText(finalText).then(() => {
            const original = copyBtn.textContent;
            copyBtn.textContent = '✅ Скопировано!';
            setTimeout(() => copyBtn.textContent = original, 1500);
        }).catch(() => {
            const ta = document.createElement('textarea');
            ta.value = finalText;
            document.body.appendChild(ta);
            ta.select();
            document.execCommand('copy');
            ta.remove();
            copyBtn.textContent = '✅ Скопировано!';
            setTimeout(() => copyBtn.textContent = '📋 Скопировать всё', 1500);
        });
    });

    clearBtn.addEventListener('click', () => {
        if (badges.length === 0) return;
        if (confirm('Удалить все бейджи?')) {
            badges = [];
            currentColorIndex = 0;
            render();
        }
    });

    render();
</script>
</body>
</html>
